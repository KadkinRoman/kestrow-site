# Checks and image builds -> GHCR. Triggers: push to main, git tag v*, manual run (Actions -> build -> Run workflow).
#
# Images: ghcr.io/kadkinroman/kestrow-cms (one for all environments) and ghcr.io/kadkinroman/kestrow-web - one per environment:
# NEXT_PUBLIC_SITE_URL and the image host are baked in at build time, and next build reads content from that environment's Strapi.
# Environment addresses are repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   STAGE_STRAPI_URL, STAGE_STRAPI_PUBLIC_URL, STAGE_SITE_URL, PROD_STRAPI_URL, PROD_STRAPI_PUBLIC_URL, PROD_SITE_URL,
#   PROD_YANDEX_METRIKA_ID (optional analytics id). An environment without variables is skipped.
#   The Kestrow demo production uses PROD_SITE_URL=https://kestrow.193-233-216-209.sslip.io,
#   PROD_STRAPI_PUBLIC_URL=https://cms-kestrow.193-233-216-209.sslip.io.
# Image tags: sha-<7 chars>, main, latest (from main), v1.2.3 (git tag); web gets an environment prefix: stage-sha-..., prod-v1.2.3.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cms:
        description: "Build the cms image"
        type: boolean
        default: true
      web_envs:
        description: "Comma-separated web environments (stage,prod); empty - all configured"
        type: string
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CMS_IMAGE: ghcr.io/kadkinroman/kestrow-cms
  WEB_IMAGE: ghcr.io/kadkinroman/kestrow-web

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Route types (PageProps<'/...'>) are generated by next typegen - without it tsc cannot see them
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test

  cms:
    name: image cms
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.cms
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CMS_IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms

  web:
    name: image web (${{ matrix.env }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: stage
            strapi_url: ${{ vars.STAGE_STRAPI_URL }}
            strapi_public_url: ${{ vars.STAGE_STRAPI_PUBLIC_URL }}
            site_url: ${{ vars.STAGE_SITE_URL }}
            metrika: ""
          - env: prod
            strapi_url: ${{ vars.PROD_STRAPI_URL }}
            strapi_public_url: ${{ vars.PROD_STRAPI_PUBLIC_URL }}
            site_url: ${{ vars.PROD_SITE_URL }}
            metrika: ${{ vars.PROD_YANDEX_METRIKA_ID }}
    steps:
      # An environment is built if its variables are set and (on a manual run) it is listed in web_envs
      - id: gate
        env:
          WANTED: ${{ inputs.web_envs }}
          URL: ${{ matrix.strapi_url }}
          ENV_NAME: ${{ matrix.env }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::$ENV_NAME: environment variables are not set - skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$WANTED" ] && ! echo ",$WANTED," | tr -d ' ' | grep -q ",$ENV_NAME,"; then
            echo "$ENV_NAME: not selected - skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.gate.outputs.run == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WEB_IMAGE }}
          flavor: |
            prefix=${{ matrix.env }}-,onlatest=true
          # type=sha has its own sha- prefix that overrides the shared one - set it explicitly, otherwise stage and prod write to the same tag
          tags: |
            type=sha,prefix=${{ matrix.env }}-sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            STRAPI_URL=${{ matrix.strapi_url }}
            STRAPI_PUBLIC_URL=${{ matrix.strapi_public_url }}
            NEXT_PUBLIC_SITE_URL=${{ matrix.site_url }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID=${{ matrix.metrika }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-${{ matrix.env }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.env }}
